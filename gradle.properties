# Gradle 9.0 needs JDK 17+ to run. Which JDK that is is inherently machine-specific
# (CI pins it via actions/setup-java; locally, set org.gradle.java.home in your own
# %USERPROFILE%\.gradle\gradle.properties — not this file, which is shared/tracked).

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official
